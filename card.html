<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=440, initial-scale=1.0">
<title>HongKong 2D Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #4aba4c;
    --page: #e9e8ef;
    --ink: #25272b;
    --card: #D1D5DB;
    --black: #111111;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    width: 440px;
    background: #ffffff;
    font-family: 'Roboto', sans-serif;
    color: var(--ink);
  }

  #captureCard {
    width: 440px;
    background: var(--page);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header {
    height: 62px;
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
  }

  .brand {
    font-size: 21px;
    font-weight: 700;
    color: var(--ink);
  }

  .badge-2d {
    font-size: 18px;
    font-weight: 900;
    color: #166534;
  }

  .body-wrap {
    padding: 14px 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .main-card {
    width: 100%;
    min-height: 156px;
    background: var(--card);
    border: 1px solid #d6d5dc;
    border-radius: 14px;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.24);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px 12px;
    gap: 8px;
  }

  .main-number {
    font-size: 74px;
    line-height: 1.02;
    font-weight: 900;
    color: var(--green);
    letter-spacing: 2px;
  }

  .updated {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
  }

  .update-check {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
  }

  .update-check svg {
    width: 100%;
    height: 100%;
  }

  .update-check svg path {
    fill: none;
    stroke: #32CD32;
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .results {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }

  .result-box {
    height: 74px;
    background: var(--card);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6px;
    box-shadow: 0 3px 7px rgba(0, 0, 0, 0.18);
  }

  .result-top {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.1;
    color: var(--black);
  }

  .line {
    width: 90%;
    height: 2px;
    background: #e5e7eb;
    margin: 5px 0;
  }

  .result-bottom {
    font-size: 28px;
    line-height: 1.1;
    font-weight: 700;
    color: var(--green);
  }

  .notices {
    margin-top: 2px;
    text-align: center;
    color: #dc2626;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.35;
  }
</style>
</head>
<body>
  <div id="captureCard">
    <header class="header">
      <div class="brand">HongKong 2D 🇭🇰</div>
      <div class="badge-2d">2D</div>
    </header>

    <div class="body-wrap">
      <section class="main-card">
        <div class="main-number" id="mainNumber">40</div>
        <div class="updated">
          <span id="updateCheck" class="update-check">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <path d="M6 17 L13 24 L27 8"/>
            </svg>
          </span>
          <span id="updateTimeText">Update : 12:39:00 PM 26-11-2026</span>
        </div>
      </section>

      <section class="results" aria-label="Result history">
        <div class="result-box">
          <div class="result-top">11:00AM</div>
          <div class="line"></div>
          <div class="result-bottom" id="s_1100">40</div>
        </div>
        <div class="result-box">
          <div class="result-top">1:00PM</div>
          <div class="line"></div>
          <div class="result-bottom" id="s_1300">??</div>
        </div>
        <div class="result-box">
          <div class="result-top">3:00PM</div>
          <div class="line"></div>
          <div class="result-bottom" id="s_1500">??</div>
        </div>
        <div class="result-box">
          <div class="result-top">5:00PM</div>
          <div class="line"></div>
          <div class="result-bottom" id="s_1700">??</div>
        </div>
        <div class="result-box">
          <div class="result-top">7:00PM</div>
          <div class="line"></div>
          <div class="result-bottom" id="s_1900">??</div>
        </div>
        <div class="result-box">
          <div class="result-top">9:00PM</div>
          <div class="line"></div>
          <div class="result-bottom" id="s_2100">??</div>
        </div>
      </section>

      <div class="notices">
        <div>Please use VPN to view the result...</div>
        <div>Every Monday is Closed....</div>
      </div>
    </div>
  </div>
</body>
</html>
