<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HongKong 2D 🇭🇰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --blue: #20a6d3;
  --green: #4aba4c;
  --page: #e9e8ef;
  --yellow: #e6ff00;
  --ink: #25272b;
  --card: #D1D5DB;
  --navy: #172554;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  background: var(--page);
  color: var(--ink);
  font-family: 'Roboto', sans-serif;
  overscroll-behavior: none;
  overflow: hidden;
  -webkit-touch-callout: none;
}

button,
.nav-item,
.three-d-btn,
.back,
.icon-btn,
.history-back,
.history2d-back {
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  outline: none;
  touch-action: manipulation;
}

button:focus,
button:active,
.nav-item:focus,
.nav-item:active,
.back:focus,
.back:active,
.icon-btn:focus,
.icon-btn:active {
  outline: none;
  background-color: transparent;
}

.three-d-btn:focus,
.history-back:focus,
.history2d-back:focus {
  outline: none;
  background-color: var(--card);
}

.three-d-btn:active,
.history-back:active,
.history2d-back:active {
  background-color: #c4c9d1;
  transform: scale(0.99);
}

.app {
  position: relative;
  width: 100%;
  max-width: 550px;
  height: 100%;
  min-height: 0;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--page);
  overflow: hidden;
}

/* HEADER */
.header {
  height: 70px;
  flex-shrink: 0;
  background: var(--card);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 8px; /* အရင်က 0 12px ကို နည်းနည်းလျှော့ပြီး ဘယ်ဘက်ပိုကပ်ရန် */
  gap: 4px; /* အရင်က 10px ကို 4px ပြောင်းပါ */
  color: var(--ink);
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
}
.back {
  width: 30px;
  height: 30px;
  font-size: 26px;
  line-height: 1;
  font-weight: 400;
  color: #0876a0;
  border: none;
  background: none;
  cursor: pointer;
  flex-shrink: 0;
}

.brand {
  font-size: clamp(18px, 5vw, 24px);
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
  flex: 1;
  padding-left: 0px; /* ဘယ်ဘက်အစွန်နဲ့ ထပ်ကပ်ချင်ရင် 0px ပြောင်းပါ */
}

.icon-btn {
  width: 40px;
  height: 30px;
  display: grid;
  place-items: center;
  color: #166534;
  background: none;
  border: none;
  padding: 0;
  font-size: 19px;
  font-weight: 900;
  cursor: pointer;
  flex-shrink: 0;
}

/* MAIN */
main {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 0 10px 6px;
  overflow: hidden;
}

/* MAIN RESULT CARD */
.main-card {
  width: 100%;
  flex: 0 0 auto;
  min-height: 166px;
  background: var(--card);
  border: 1px solid #d6d5dc;
  border-radius: 14px;
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.30);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 18px 12px;
  color: var(--ink);
  gap: 8px;
}

/* 2D MAIN CARD: header နဲ့ 15px / အောက် result box တွေနဲ့ 10px ခွာရန် */
#page-2d .main-card {
  margin-top: 20px;
  margin-bottom: 10px;
}

/* 3D MAIN CARD: header နဲ့ 15px ခွာရန် */
#page-3d .main-card {
  margin-top: 15px;
}

.main-number {
  font-size: clamp(60px, 18vw, 82px);
  line-height: 1.02;
  font-weight: 900;
  color: var(--green);
  letter-spacing: 2px;
}

.updated {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  font-size: clamp(12px, 3.6vw, 17px);
  line-height: 1.2;
  text-align: center;
  font-weight: 500;
  overflow-wrap: anywhere;
}

.update-check {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  flex-shrink: 0;
}

.update-check[hidden] {
  display: none;
}

.update-check svg {
  width: 100%;
  height: 100%;
}

.update-check svg path {
  fill: none;
  stroke: #32CD32;
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* PAGE SWITCH */
.live-page {
  display: none;
  width: 100%;
  flex: 1;
  min-height: 0;
  flex-direction: column;
  justify-content: flex-start;
  gap: 12px;
  overflow: hidden;
}

.live-page.active {
  display: flex;
}

/* 2D MAIN VIEW (NO SCROLL, COMPACT BOXES) */
#page-2d.active:not(.history-open) .results {
  width: 100%;
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-template-rows: repeat(3, minmax(0, 74px)) auto auto;
  gap: 7px;
}

.result-box {
  min-width: 0;
  min-height: 0;
  height: 100%;
  background: var(--card);
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 6px 6px;
  box-shadow: 0 3px 7px rgba(0, 0, 0, 0.20);
}

.result-top {
  font-size: clamp(15px, 4.2vw, 22px);
  font-weight: 700;
  line-height: 1.1;
  color: var(--navy);
}

.line {
  width: 90%;
  height: 2px;
  background: #e5e7eb;
  margin: 5px 0;
  flex-shrink: 0;
}

.result-bottom {
  font-size: clamp(22px, 6vw, 34px);
  line-height: 1.1;
  color: var(--green);
  font-weight: 700;
}

/* NOTICES */
.vpn-notice,
.monday-notice {
  grid-column: 1 / -1;
  width: 100%;
  text-align: center;
  color: #dc2626;
  font-size: clamp(13px, 3.8vw, 17px);
  font-weight: 700;
  line-height: 1.25;
  padding: 1px 4px;
  margin-top: 4px;
}

/* 3D MAIN VIEW (NO SCROLL) */
.three-d-buttons {
  display: flex;
  gap: 8px;
  width: 100%;
  margin-top: 2px;
  flex-shrink: 0;
}

.three-d-btn {
  flex: 1;
  min-width: 0;
  padding: 12px 8px;
  border: none;
  border-radius: 12px;
  background: var(--card);
  color: var(--navy);
  font-size: clamp(13px, 3.8vw, 16px);
  font-weight: 700;
  box-shadow: 0 3px 7px rgba(0, 0, 0, 0.20);
  cursor: pointer;
  transition: transform 0.08s ease, background-color 0.12s ease;
}

/* TOAST */
.toast {
  position: absolute;
  left: 50%;
  bottom: 70px;
  transform: translateX(-50%) translateY(12px);
  background: rgba(23, 37, 84, 0.94);
  color: #fff;
  padding: 8px 16px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
  z-index: 1000;
  white-space: nowrap;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* BOTTOM NAV */
.bottom-nav {
  display: flex;
  flex-shrink: 0;
  width: 100%;
  height: 58px;
  background: #fff;
  box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.08);
  z-index: 999;
}

.nav-item {
  flex: 1;
  height: 100%;
  border: none;
  background: transparent;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 3px;
  color: #718096;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}

.nav-icon {
  font-size: 21px;
  line-height: 1;
}

.nav-item.active {
  color: #15243a;
  font-weight: 700;
}

/* SHORT VIEWPORTS */
@media (max-height: 700px) {
  #page-2d.active:not(.history-open) .results {
    grid-template-rows: repeat(3, minmax(0, 64px)) auto auto;
    gap: 5px;
  }

  .live-page {
    gap: 8px;
  }

  .main-card {
    min-height: 112px;
    padding: 10px;
    gap: 4px;
  }

  .main-number {
    font-size: clamp(44px, 13vw, 62px);
  }
}

/* VERY SMALL PHONES */
@media (max-width: 350px) {
  .brand {
    font-size: 17px;
  }

  .main-number {
    font-size: 40px;
  }
}

/* TABLETS AND LARGE SCREENS */
@media (min-width: 551px) {
  .app {
    box-shadow: 0 0 24px rgba(0, 0, 0, 0.12);
  }
}

/* MAIN NUMBER ANIMATION */
#main-number {
  animation: mainNumberBlink 7s linear infinite;
}

@keyframes mainNumberBlink {
  0%, 28.56%, 35.71%, 64.27%, 71.42%, 100% {
    opacity: 1;
  }
  28.57%, 35.70%, 64.28%, 71.41% {
    opacity: 0;
  }
}

#main-number.result-locked {
  animation: none !important;
  opacity: 1 !important;
  visibility: visible !important;
}

#main-number.pre-result {
  animation: mainNumberBlink 7s linear infinite !important;
}

/* 3D & 2D HISTORY (SCROLLABLE LIST) */
#hongkong-history,
#twoD-history {
  display: none;
  flex: 1;
  min-height: 0;
  flex-direction: column;
  gap: 10px;
  padding: 4px 0 8px;
  overflow: hidden;
}

#page-3d.history-open > .main-card,
#page-3d.history-open > .three-d-buttons,
#page-2d.history-open > .main-card,
#page-2d.history-open > .results {
  display: none;
}

#page-3d.history-open > #hongkong-history,
#page-2d.history-open > #twoD-history {
  display: flex;
}

.history-header {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.history-back,
.history2d-back {
  flex-shrink: 0;
  border: none;
  border-radius: 10px;
  padding: 8px 14px;
  background: var(--card);
  color: var(--navy);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

.history-title {
  font-size: clamp(17px, 4.5vw, 20px);
  font-weight: 700;
  color: var(--navy);
}

.history-list,
.history2d-list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 2px 2px 16px;
}

.history-card {
  width: 100%;
  min-height: 60px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 16px;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
}

.history-date {
  color: var(--navy);
  font-size: 15px;
  font-weight: 500;
}

.history-number {
  color: #166534;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 2px;
}

.history-empty,
.history2d-empty {
  text-align: center;
  color: #718096;
  padding: 20px 8px;
}

body.history-mode .header {
  display: none;
}

.history2d-card {
  background: var(--card);
  border-radius: 12px;
  padding: 12px;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
  flex-shrink: 0;
}

.history2d-date {
  text-align: center;
  color: var(--navy);
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 10px;
}

.history2d-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
}

.history2d-item {
  background: #fff;
  border-radius: 8px;
  padding: 8px 4px;
  text-align: center;
}

.history2d-time {
  color: var(--navy);
  font-size: 14px;
  font-weight: 700;
}

.history2d-number {
  color: #166534;
  font-size: 26px;
  font-weight: 700;
  margin-top: 4px;
}
</style>
</head>
<body>
  <div class="app">

      <div class="brand" id="header-brand">HongKong 2D 🇭🇰</div>

      <div id="page-3d" class="live-page">

          <button class="three-d-btn" onclick="open3D('thai', this)">Thai 3D</button>
        </div>

        <section id="hongkong-history">
          <div class="history-header">
            <button class="history-back" onclick="close3DHistory(this)">‹ Back</button>
            <div class="history-title">Hong Kong 3D History</div>

          <div id="hongkong-history-list" class="history-list">
            <div class="history-empty">Loading history...</div>
          </div>
        </section>
      </div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <nav class="bottom-nav">
      <button class="nav-item active" id="nav-2d" onclick="openLive('2d', this)">
        <span class="nav-icon">📈</span>
        <span>2D Live</span>
      </button>
      <button class="nav-item" id="nav-3d" onclick="openLive('3d', this)">
        <span class="nav-icon">◇</span>
        <span>3D Live</span>
      </button>
    </nav>
  </div>

  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-database-compat.js"></script>
  <script>
    const SLOT_MS = 7000;
    const SLOT_3D_MS = 10000;

    const firebaseConfig = {
      apiKey: "AIzaSyBHmTO8u8VyFAkU9ApOL8xwsmRgPNgs9dw",
      authDomain: "hongkong2d.firebaseapp.com",
      databaseURL: "https://hongkong2d-default-rtdb.firebaseio.com",
      projectId: "hongkong2d",
      storageBucket: "hongkong2d.firebasestorage.app",
      messagingSenderId: "441539540436",
      appId: "1:441539540436:web:b9e8a56829cf8ffabdd241"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const pad = n => String(n).padStart(2, "0");
    const getTwoDigit = value => String(value).padStart(2, "0");
    const isValidTwoDigit = value => value !== undefined && value !== null && /^\d{1,2}$/.test(String(value));
    const isValidThreeDigit = value => value !== undefined && value !== null && /^\d{1,3}$/.test(String(value));

    let serverTimeOffset = 0;
    let serverTimeReady = false;
    let lastSlotKey = "";
    let processingDraw = false;
    let historyServerTimeAnchor = 0;
    let historyMonotonicAnchor = 0;

    let preResultsData = {};
    let preResult3DCache = null;
    let results3DCache = {};
    let toastTimer = null;

    const drawTimes = [
      { label: "11:00AM", key: "1100AM", preKey: "11:00AM", seconds: 11 * 3600 },
      { label: "1:00PM",  key: "0100PM", preKey: "01:00PM", seconds: 13 * 3600 },
      { label: "3:00PM",  key: "0300PM", preKey: "03:00PM", seconds: 15 * 3600 },
      { label: "5:00PM",  key: "0500PM", preKey: "05:00PM", seconds: 17 * 3600 },
      { label: "7:00PM",  key: "0700PM", preKey: "07:00PM", seconds: 19 * 3600 },
      { label: "9:00PM",  key: "0900PM", preKey: "09:00PM", seconds: 21 * 3600 }
    ];

    const history2DTimes = [
      "11:00 AM", "1:00 PM", "3:00 PM",
      "5:00 PM", "7:00 PM", "9:00 PM"
    ];

    const initial3DHistory = {
      "2026-10-28": "291", "2026-10-21": "563", "2026-10-14": "109",
      "2026-10-07": "436", "2026-09-30": "782", "2026-09-23": "048",
      "2026-09-16": "615", "2026-09-09": "970", "2026-09-02": "324",
      "2026-08-26": "856", "2026-08-19": "193", "2026-08-12": "508",
      "2026-08-05": "741", "2026-07-29": "062", "2026-07-22": "395",
      "2026-07-15": "827", "2026-07-08": "014", "2026-07-01": "679",
      "2026-06-24": "230", "2026-06-17": "451", "2026-06-10": "894",
      "2026-06-03": "168", "2026-05-27": "705", "2026-05-20": "342",
      "2026-05-13": "916", "2026-05-06": "027", "2026-04-29": "583"
    };

    function showToast(message) {
      const toast = document.getElementById("toast");
      if (!toast) return;
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2000);
    }

    function getHistoryServerNow() {
      if (!serverTimeReady) return 0;
      return historyServerTimeAnchor + (performance.now() - historyMonotonicAnchor);
    }

    function getMyanmarDate() {
      const ms = getHistoryServerNow();
      const d = new Date(ms + 390 * 60 * 1000);
      return {
        date: `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`,
        hour: d.getUTCHours(),
        minute: d.getUTCMinutes(),
        second: d.getUTCSeconds(),
        weekday: d.getUTCDay()
      };
    }

    function getSlotKey(t) {
      const slot = Math.floor(t.second / 7);
      return `${t.date}_${pad(t.hour)}_${pad(t.minute)}_${slot}`;
    }

    function updateMainNumber(value) {
      const el = document.getElementById("main-number");
      const check = document.getElementById("update-check");
      if (!el) return;

      const showCheck = status => {
        if (check) check.hidden = !status;
      };

      showCheck(false);
      el.classList.remove("pre-result", "result-locked");

      if (!serverTimeReady) {
        el.textContent = "--";
        return;
      }

      const t = getMyanmarDate();
      if (t.weekday === 1) {
        el.textContent = "--";
        return;
      }

      const secondsNow = t.hour * 3600 + t.minute * 60 + t.second;

      if (secondsNow >= 21 * 3600) {
        const finalValue = preResultsData["09:00PM"];
        if (isValidTwoDigit(finalValue)) {
          el.textContent = getTwoDigit(finalValue);
          el.classList.add("result-locked");
          showCheck(true);
        }
        return;
      }

      for (const draw of drawTimes) {
        const preStart = draw.seconds - 18;
        const freezeUntil = draw.seconds + 10 * 60;

        if (secondsNow >= preStart && secondsNow < freezeUntil) {
          const resultValue = preResultsData[draw.preKey];
          const validResult = isValidTwoDigit(resultValue);

          if (validResult) {
            el.textContent = getTwoDigit(resultValue);
          }

          if (secondsNow < draw.seconds) {
            el.classList.add("pre-result");
            showCheck(false);
          } else {
            el.classList.add("result-locked");
            showCheck(validResult);
          }
          return;
        }
      }

      el.textContent = getTwoDigit(value);
    }

    function updateClock() {
      if (!serverTimeReady) return;

      const now = getHistoryServerNow();
      const myanmarNow = new Date(now + 390 * 60 * 1000);

      const slot2D = Math.floor(myanmarNow.getUTCSeconds() / 7) * 7;
      const display2D = new Date(now + 390 * 60 * 1000);
      display2D.setUTCSeconds(slot2D, 0);

      const formatTime = d =>
        `${pad(d.getUTCHours() % 12 || 12)}:` +
        `${pad(d.getUTCMinutes())}:` +
        `${pad(d.getUTCSeconds())} ` +
        `${d.getUTCHours() >= 12 ? "PM" : "AM"} ` +
        `${pad(d.getUTCDate())}-` +
        `${pad(d.getUTCMonth() + 1)}-` +
        `${d.getUTCFullYear()}`;

      const el2d = document.getElementById("update-time");
      if (el2d) el2d.textContent = formatTime(display2D);

      const el3d = document.getElementById("update-time-3d");
      const weekday = myanmarNow.getUTCDay();
      const secondsNow =
        myanmarNow.getUTCHours() * 3600 +
        myanmarNow.getUTCMinutes() * 60 +
        myanmarNow.getUTCSeconds();

      const startAt = 9 * 3600;
      const preTime = 20 * 3600 + 59 * 60 + 50;
      const freezeAt = 21 * 3600;

      if (el3d) {
        if (weekday === 3 && secondsNow >= startAt && secondsNow < preTime) {
          const elapsed = secondsNow - startAt;
          const slotSeconds = Math.floor(elapsed / 10) * 10;
          const display3D = new Date(myanmarNow.getTime());
          display3D.setUTCHours(9, 0, 0, 0);
          display3D.setTime(display3D.getTime() + slotSeconds * 1000);
          el3d.textContent = formatTime(display3D);
        } else if (weekday === 3 && secondsNow >= preTime && secondsNow < freezeAt) {
          const display3D = new Date(myanmarNow.getTime());
          display3D.setUTCHours(20, 59, 50, 0);
          el3d.textContent = formatTime(display3D);
        } else if ((weekday === 3 && secondsNow >= freezeAt) || weekday === 4) {
          const frozen = new Date(myanmarNow.getTime());
          if (weekday === 4) {
            frozen.setUTCDate(frozen.getUTCDate() - 1);
          }
          frozen.setUTCHours(21, 0, 0, 0);
          el3d.textContent = formatTime(frozen);
        } else {
          el3d.textContent = "--:--:-- -- --";
        }
      }
    }

    async function loadRandomSlot() {
      if (!serverTimeReady || processingDraw) return;

      const t = getMyanmarDate();
      if (t.weekday === 1) {
        document.getElementById("main-number").textContent = "--";
        return;
      }

      const secondsNow = t.hour * 3600 + t.minute * 60 + t.second;

      if (secondsNow >= 21 * 3600) {
        updateMainNumber(document.getElementById("main-number")?.textContent || "--");
        return;
      }

      for (const draw of drawTimes) {
        if (secondsNow >= draw.seconds - 18 && secondsNow < draw.seconds + 10 * 60) {
          updateMainNumber(document.getElementById("main-number")?.textContent || "--");
          return;
        }
      }

      const slotKey = getSlotKey(t);
      if (slotKey === lastSlotKey) return;
      lastSlotKey = slotKey;

      const slotRef = database.ref("randomSlots/" + slotKey);

      try {
        const result = await slotRef.transaction(current => {
          if (current !== null) return;
          return getTwoDigit(Math.floor(Math.random() * 100));
        });

        if (!result.snapshot.exists()) {
          throw new Error("Random slot transaction failed");
        }

        const value = getTwoDigit(result.snapshot.val());
        const latest = getMyanmarDate();
        const latestSeconds = latest.hour * 3600 + latest.minute * 60 + latest.second;

        if (
          getSlotKey(latest) !== slotKey ||
          latestSeconds >= 21 * 3600 ||
          drawTimes.some(draw => latestSeconds >= draw.seconds - 18 && latestSeconds < draw.seconds + 10 * 60)
        ) {
          return;
        }

        updateMainNumber(value);
        await database.ref("live/number").set(value);
      } catch (error) {
        console.error("Random slot error:", error);
        lastSlotKey = "";
      }
    }

    function processDraws() {
      if (!serverTimeReady) return;

      const t = getMyanmarDate();
      if (t.weekday === 1) {
        renderResults({});
        return;
      }

      const secondsNow = t.hour * 3600 + t.minute * 60 + t.second;
      const results = {};

      drawTimes.forEach(draw => {
        if (secondsNow >= draw.seconds) {
          const value = preResultsData[draw.preKey];
          results[draw.key] = isValidTwoDigit(value) ? getTwoDigit(value) : "";
        } else {
          results[draw.key] = "";
        }
      });

      renderResults(results);
    }

    function renderResults(results) {
      const boxes = document.querySelectorAll("#results .result-box");
      drawTimes.forEach((draw, index) => {
        const box = boxes[index];
        if (!box) return;
        const resultEl = box.querySelector(".result-bottom");
        if (!resultEl) return;

        resultEl.textContent =
          results[draw.key] !== undefined && results[draw.key] !== ""
            ? getTwoDigit(results[draw.key])
            : "??";
      });
    }

    let history2DInitializedDate = "";
    let history2DProcessing = false;
    let history2DListenerAttached = false;
    let history3DListenerAttached = false;

    async function process2DHistory() {
      if (!serverTimeReady || history2DProcessing) return;

      const t = getMyanmarDate();
      if (t.weekday === 1) return;

      history2DProcessing = true;

      try {
        const historyRef = database.ref("history2D");

        if (history2DInitializedDate !== t.date) {
          await historyRef.child(t.date).transaction(current => {
            if (current !== null) return current;
            return {};
          });
          history2DInitializedDate = t.date;
        }

        const secondsNow = t.hour * 3600 + t.minute * 60 + t.second;

        for (let index = 0; index < drawTimes.length; index++) {
          const draw = drawTimes[index];
          if (secondsNow < draw.seconds) continue;

          const value = preResultsData[draw.preKey];
          if (!isValidTwoDigit(value)) continue;

          const finalValue = getTwoDigit(value);
          const resultRef = historyRef.child(t.date).child(String(index));

          await resultRef.transaction(current => {
            if (current !== null) return current;
            return finalValue;
          });
        }
      } catch (error) {
        console.error("2D Auto History Error:", error);
      } finally {
        history2DProcessing = false;
      }
    }

    async function showHistory(button) {
      if (button) button.blur();
      const page = document.getElementById("page-2d");
      page.classList.add("history-open");
      document.body.classList.add("history-mode");

      const list = document.getElementById("twoD-history-list");
      list.innerHTML = '<div class="history2d-empty">Loading history...</div>';

      if (!serverTimeReady) {
        list.innerHTML = '<div class="history2d-empty">Server time မရသေးပါ။</div>';
        return;
      }

      if (!history2DListenerAttached) {
        history2DListenerAttached = true;
        database.ref("history2D").on("value", snapshot => {
          render2DHistory(snapshot.val() || {});
        });
      }

      await process2DHistory();
    }

    function close2DHistory(button) {
      if (button) button.blur();
      document.getElementById("page-2d").classList.remove("history-open");
      document.body.classList.remove("history-mode");
    }

    function render2DHistory(data) {
      const list = document.getElementById("twoD-history-list");
      if (!list) return;

      const entries = Object.entries(data)
        .filter(([date, values]) =>
          /^\d{4}-\d{2}-\d{2}$/.test(date) &&
          new Date(date + "T00:00:00Z").getUTCDay() !== 1 &&
          values &&
          typeof values === "object"
        )
        .sort(([a], [b]) => b.localeCompare(a));

      list.replaceChildren();

      if (!entries.length) {
        list.innerHTML = '<div class="history2d-empty">History မရှိသေးပါ။</div>';
        return;
      }

      for (const [date, values] of entries) {
        const card = document.createElement("div");
        card.className = "history2d-card";

        const dateEl = document.createElement("div");
        dateEl.className = "history2d-date";
        dateEl.textContent = date;

        const grid = document.createElement("div");
        grid.className = "history2d-grid";

        history2DTimes.forEach((time, index) => {
          const item = document.createElement("div");
          item.className = "history2d-item";

          const timeEl = document.createElement("div");
          timeEl.className = "history2d-time";
          timeEl.textContent = time;

          const numberEl = document.createElement("div");
          numberEl.className = "history2d-number";

          const value = values[index];
          numberEl.textContent = isValidTwoDigit(value)
            ? getTwoDigit(value)
            : "??";

          item.append(timeEl, numberEl);
          grid.appendChild(item);
        });

        card.append(dateEl, grid);
        list.appendChild(card);
      }
    }

    function openLive(type, button) {
      close2DHistory();
      close3DHistory();

      document.querySelectorAll(".live-page").forEach(page => {
        page.classList.remove("active");
      });

      const target = document.getElementById("page-" + type);
      if (target) target.classList.add("active");

      document.querySelectorAll(".nav-item").forEach(btn => {
        btn.classList.remove("active");
      });

      if (button) {
        button.classList.add("active");
        button.blur();
      }

      const brandEl = document.getElementById("header-brand");
      const historyBtn = document.getElementById("header-history-btn");

      if (brandEl) {
        brandEl.textContent = type === "3d" ? "3D LIVE" : "HongKong 2D 🇭🇰";
      }

      if (historyBtn) {
        historyBtn.style.visibility = type === "3d" ? "hidden" : "visible";
      }
    }

    function handleHeaderBack(button) {
      if (button) button.blur();
      if (document.getElementById("page-2d")?.classList.contains("history-open")) {
        close2DHistory();
        return;
      }
      if (document.getElementById("page-3d")?.classList.contains("history-open")) {
        close3DHistory();
        return;
      }
      if (document.getElementById("page-3d")?.classList.contains("active")) {
        openLive("2d", document.getElementById("nav-2d"));
        return;
      }
      if (window.history.length > 1) {
        window.history.back();
      } else {
        showToast("Main Screen");
      }
    }

    async function open3D(type, button) {
      if (button) button.blur();
      if (type !== "hongkong") {
        showToast("Thai 3D Coming Soon");
        return;
      }

      const page = document.getElementById("page-3d");
      page.classList.add("history-open");
      document.body.classList.add("history-mode");

      try {
        await database.ref("results3D").transaction(current => {
          const data = current && typeof current === "object" ? { ...current } : {};
          for (const [date, number] of Object.entries(initial3DHistory)) {
            if (data[date] === undefined || data[date] === null) {
              data[date] = number;
            }
          }
          return data;
        });

        renderHongKong3DHistory(results3DCache);
      } catch (error) {
        console.error("3D history load error:", error);
        document.getElementById("hongkong-history-list").innerHTML =
          '<div class="history-empty">History ဖတ်မရပါ။ Firebase Rules ကို စစ်ဆေးပါ။</div>';
      }
    }

    function close3DHistory(button) {
      if (button) button.blur();
      document.getElementById("page-3d").classList.remove("history-open");
      document.body.classList.remove("history-mode");
    }

    function renderHongKong3DHistory(data) {
      const list = document.getElementById("hongkong-history-list");
      if (!list) return;

      const entries = Object.entries(data || {})
        .filter(([date, value]) =>
          /^\d{4}-\d{2}-\d{2}$/.test(date) &&
          isValidThreeDigit(value)
        )
        .sort(([dateA], [dateB]) => dateB.localeCompare(dateA));

      if (!entries.length) {
        list.innerHTML = '<div class="history-empty">History မရှိသေးပါ။</div>';
        return;
      }

      list.replaceChildren();

      for (const [date, value] of entries) {
        const card = document.createElement("div");
        card.className = "history-card";

        const dateEl = document.createElement("span");
        dateEl.className = "history-date";

        const [year, month, day] = date.split("-");
        dateEl.textContent = `${day}-${month}-${year}`;

        const numberEl = document.createElement("span");
        numberEl.className = "history-number";
        numberEl.textContent = String(value).padStart(3, "0");

        card.append(dateEl, numberEl);
        list.appendChild(card);
      }
    }

    let lastSlot3D = "";
    let current3DValue = "";
    let processing3D = false;
    let saved3DFinalDate = "";

    function getWednesday3DTime() {
      const now = getHistoryServerNow();
      const d = new Date(now + 390 * 60 * 1000);
      return {
        date: `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`,
        weekday: d.getUTCDay(),
        milliseconds:
          ((d.getUTCHours() * 60 + d.getUTCMinutes()) * 60 +
          d.getUTCSeconds()) * 1000 + d.getUTCMilliseconds()
      };
    }

    function display3DNumber(value, phaseMs) {
      const el = document.getElementById("main-number-3d");
      if (!el) return;
      el.textContent = String(value).padStart(3, "0");
      const visible = (phaseMs < 4000) || (phaseMs >= 5000 && phaseMs < 9000);
      el.style.visibility = visible ? "visible" : "hidden";
    }

    function show3DFinal(value) {
      const el = document.getElementById("main-number-3d");
      if (!el) return;
      el.textContent = String(value).padStart(3, "0");
      el.style.visibility = "visible";
    }

    async function update3DRandom() {
      const el = document.getElementById("main-number-3d");
      if (!el || !serverTimeReady || processing3D) return;

      const t = getWednesday3DTime();
      const startMs = 9 * 3600 * 1000;
      const preTimeMs = (20 * 3600 + 59 * 60 + 50) * 1000;
      const finalTimeMs = 21 * 3600 * 1000;

      if (t.weekday === 4) {
        const previousWednesday = new Date(
          Date.UTC(
            Number(t.date.slice(0, 4)),
            Number(t.date.slice(5, 7)) - 1,
            Number(t.date.slice(8, 10))
          )
        );
        previousWednesday.setUTCDate(previousWednesday.getUTCDate() - 1);

        const resultDate =
          `${previousWednesday.getUTCFullYear()}-` +
          `${pad(previousWednesday.getUTCMonth() + 1)}-` +
          `${pad(previousWednesday.getUTCDate())}`;

        const savedVal = results3DCache[resultDate];
        if (isValidThreeDigit(savedVal)) {
          show3DFinal(savedVal);
        } else {
          el.textContent = "---";
          el.style.visibility = "visible";
        }
        return;
      }

      if (t.weekday !== 3 || t.milliseconds < startMs) {
        el.textContent = "---";
        el.style.visibility = "visible";
        return;
      }

      if (t.milliseconds >= preTimeMs && t.milliseconds < finalTimeMs) {
        if (isValidThreeDigit(preResult3DCache)) {
          show3DFinal(preResult3DCache);
        } else {
          el.textContent = "---";
          el.style.visibility = "visible";
        }
        return;
      }

      if (t.milliseconds >= finalTimeMs) {
        const finalCandidate = isValidThreeDigit(preResult3DCache)
          ? String(preResult3DCache).padStart(3, "0")
          : results3DCache[t.date];

        if (!isValidThreeDigit(finalCandidate)) {
          el.textContent = "---";
          el.style.visibility = "visible";
          return;
        }

        const finalValue = String(finalCandidate).padStart(3, "0");
        show3DFinal(finalValue);

        if (saved3DFinalDate !== t.date) {
          processing3D = true;
          try {
            const finalRef = database.ref("results3D/" + t.date);
            const finalResult = await finalRef.transaction(current => {
              if (current !== null) return current;
              return finalValue;
            });
            if (finalResult.snapshot.exists()) {
              saved3DFinalDate = t.date;
              show3DFinal(finalResult.snapshot.val());
            }
          } catch (error) {
            console.error("3D final save error:", error);
          } finally {
            processing3D = false;
          }
        }
        return;
      }

      const elapsedMs = t.milliseconds - startMs;
      const slot = Math.floor(elapsedMs / SLOT_3D_MS);
      const slotKey = `${t.date}_${slot}`;

      if (slotKey !== lastSlot3D || !current3DValue) {
        processing3D = true;
        try {
          const randomRef = database.ref("randomSlots3D/" + slotKey);
          const randomResult = await randomRef.transaction(current => {
            if (current !== null) return current;
            return String(Math.floor(Math.random() * 1000)).padStart(3, "0");
          });

          if (!randomResult.snapshot.exists()) return;
          current3DValue = String(randomResult.snapshot.val()).padStart(3, "0");
          lastSlot3D = slotKey;
        } catch (error) {
          console.error("3D random error:", error);
          return;
        } finally {
          processing3D = false;
        }
      }

      const latest = getWednesday3DTime();
      if (
        latest.weekday !== 3 ||
        latest.date !== t.date ||
        latest.milliseconds < startMs ||
        latest.milliseconds >= preTimeMs ||
        Math.floor((latest.milliseconds - startMs) / SLOT_3D_MS) !== slot
      ) {
        return;
      }

      const phaseMs = (latest.milliseconds - startMs) % SLOT_3D_MS;
      display3DNumber(current3DValue, phaseMs);
    }

    database.ref(".info/serverTimeOffset").on("value", snapshot => {
      serverTimeOffset = Number(snapshot.val() || 0);
      serverTimeReady = true;

      historyServerTimeAnchor = Date.now() + serverTimeOffset;
      historyMonotonicAnchor = performance.now();

      updateClock();
      loadRandomSlot();
      processDraws();
      process2DHistory();
      update3DRandom();
    });

    database.ref("live/number").on("value", snapshot => {
      const value = snapshot.val();
      if (value !== null && value !== undefined) {
        updateMainNumber(value);
      }
    });

    database.ref("preResults").on("value", snapshot => {
      preResultsData = snapshot.val() || {};
      const currentValue = document.getElementById("main-number")?.textContent || "--";
      updateMainNumber(currentValue);
      processDraws();
      process2DHistory();
    });

    database.ref("preResults3D").on("value", snapshot => {
      preResult3DCache = snapshot.val();
      update3DRandom();
    });

    database.ref("results3D").on("value", snapshot => {
      results3DCache = snapshot.val() || {};
      if (history3DListenerAttached) {
        renderHongKong3DHistory(results3DCache);
      }
      update3DRandom();
    });

    database.ref("results3D").once("value").then(() => {
      history3DListenerAttached = true;
    });

    setInterval(() => {
      updateClock();
      loadRandomSlot();
      processDraws();
      process2DHistory();
    }, 1000);

    setInterval(update3DRandom, 250);
  </script>
</body>
